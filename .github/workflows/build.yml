name: Simple MSBuild

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Project
      run: msbuild TwinkieX.sln /p:Configuration=TMCN /p:Platform=x64 /p:IncludePath="D:/a/TwinkieX/TwinkieX/TwinkieX/Includes"; msbuild TwinkieX.sln /p:Configuration=ESWC /p:Platform=x86 /p:IncludePath="D:/a/TwinkieX/TwinkieX/TwinkieX/Includes"; msbuild TwinkieX.sln /p:Configuration=TMO  /p:Platform=x86 /p:IncludePath="D:/a/TwinkieX/TwinkieX/TwinkieX/Includes"; msbuild TwinkieX.sln /p:Configuration=TMSX /p:Platform=x86 /p:IncludePath="D:/a/TwinkieX/TwinkieX/TwinkieX/Includes"

    - name: Install NSIS
      uses: negrutiu/nsis-install@v2

    - name: Create installers
      run: mkdir D:/a/TwinkieX/TwinkieX/NSIS/Scripts/Output; makensis D:/a/TwinkieX/TwinkieX/NSIS/Scripts/InstallerTMCN.nsi; makensis D:/a/TwinkieX/TwinkieX/NSIS/Scripts/InstallerESWC.nsi; makensis D:/a/TwinkieX/TwinkieX/NSIS/Scripts/InstallerTMO.nsi; makensis D:/a/TwinkieX/TwinkieX/NSIS/Scripts/InstallerTMSX.nsi