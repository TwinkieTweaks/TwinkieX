name: Test

on:
  push:
    branches: [ "development" ]
    paths:
      - 'TwinkieX/**'
      - 'DInput8Loader/**'
      - '.github/**'
      - 'TwinkieX.sln'
      - 'GenerateVersion.ps1'
      - '.gitignore'
      - 'CompatCheck/**'
  pull_request:
    branches: [ "development" ]
    paths:
      - 'TwinkieX/**'
      - 'DInput8Loader/**'
      - '.github/**'
      - 'TwinkieX.sln'
      - 'GenerateVersion.ps1'
      - '.gitignore'
      - 'CompatCheck/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: TMCN
            platform: x64
            aka: x64
          - config: ESWC
            platform: x86
            aka: Win32
          - config: TMU
            platform: x86
            aka: Win32
          - config: TMO
            platform: x86
            aka: Win32
          - config: TMSX
            platform: x86
            aka: Win32
          - config: TM1
            platform: x86
            aka: Win32
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Restore file timestamps
      uses: chetan/git-restore-mtime-action@v2

    - name: Cache intermediate files
      uses: actions/cache@v4
      with:
        path: Intermediates
        key: ${{ runner.os }}-msbuild-${{ matrix.config }}-${{ matrix.platform }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-msbuild-${{ matrix.config }}-${{ matrix.platform }}-

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Project
      run: |
        $env:CL = "/pathmap:${{ github.workspace }}\=.\"
        msbuild TwinkieX.sln `
          /p:Configuration=${{ matrix.config }} `
          /p:Platform=${{ matrix.platform }} `
          /p:IncludePath="${{ github.workspace }}/TwinkieX/Includes" `
          /m
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config }}-${{ matrix.platform }}
        path: ${{ github.workspace }}/Builds/${{ matrix.aka }}/${{ matrix.config }}/
  
  compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install python
        uses: actions/setup-python@v7
        
      - name: Run compatcheck.py
        run: | 
          python CompatCheck/compatcheck.py -i ${{ github.workspace }}/ -a CompatCheck/OpenplanetCore.json -r -g
      
      - name: Publish percentage badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 58af903812974242f5c4645caa2b77f2
          filename: compatcheck_percentage_badge.json
          label: Openplanet Compatiblity
          message: ${{ env.NON_PARTIAL_PERCENTAGE }}%
          valColorRange: ${{ env.NON_PARTIAL_PERCENTAGE }}
          minColorRange: 0
          maxColorRange: 100