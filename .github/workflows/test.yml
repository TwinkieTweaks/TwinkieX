name: Test

on:
  push:
    branches: [ "development" ]
    paths:
      - 'TwinkieX/**'
      - 'DInput8Loader/**'
      - '.github/workflows/test.yml'
      - 'TwinkieX.sln'
      - 'GenerateVersion.ps1'
      - '.gitignore'
      - 'Directory.Build.props'
  pull_request:
    branches: [ "development" ]
    paths:
      - 'TwinkieX/**'
      - 'DInput8Loader/**'
      - '.github/workflows/test.yml'
      - 'TwinkieX.sln'
      - 'GenerateVersion.ps1'
      - '.gitignore'
      - 'Directory.Build.props'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: TMCN
            platform: x64
            aka: x64
          - config: ESWC
            platform: x86
            aka: Win32
          - config: TMU
            platform: x86
            aka: Win32
          - config: TMO
            platform: x86
            aka: Win32
          - config: TMSX
            platform: x86
            aka: Win32
          - config: TM1
            platform: x86
            aka: Win32
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Restore file timestamps
      uses: chetan/git-restore-mtime-action@v2

    - name: Cache intermediate files
      uses: actions/cache@v4
      with:
        path: Intermediates
        key: ${{ runner.os }}-msbuild-${{ matrix.config }}-${{ matrix.platform }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-msbuild-${{ matrix.config }}-${{ matrix.platform }}-
    
    - name: vcpkg build
      uses: johnwason/vcpkg-action@v8
      id: vcpkg
      with:
        triplet: ${{ matrix.platform }}-windows-release 
        token: ${{ github.token }}
    
    - name: Setup vcpkg Binary Caching
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          ${{ github.workspace }}/vcpkg_installed
        key: vcpkg-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.platform }}-

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run:
        nuget restore TwinkieX.sln
    - name: Build Project
      run: |
        $env:CL = "/experimental:deterministic /pathmap:${{ github.workspace }}\=.\"
        msbuild TwinkieX.sln `
          /p:Configuration=${{ matrix.config }} `
          /p:Platform=${{ matrix.platform }} `
          /p:IncludePath="${{ github.workspace }}/TwinkieX/Includes" `
          /m
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config }}-${{ matrix.platform }}
        path: ${{ github.workspace }}/Builds/${{ matrix.aka }}/${{ matrix.config }}/
